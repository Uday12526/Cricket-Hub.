<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#14231a;--mute:#5d6b62;--turf:#1f5c3a;--ball:#b3262e;--willow:#e6c98f;--line:#dbe3da;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--card:#182820;--ink:#eef3ee;--mute:#9db0a3;--turf:#4fb27d;--line:#2a3d32}}
:root[data-theme="dark"]{--bg:#0f1a14;--card:#182820;--ink:#eef3ee;--mute:#9db0a3;--turf:#4fb27d;--line:#2a3d32}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;padding-bottom:84px;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;letter-spacing:.2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--turf);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:28px}
.ball{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--ball);margin-right:8px;box-shadow:inset 0 0 0 2px #fff3;vertical-align:-1px}
.hero{padding:22px 16px 8px}
.hero h2{font-size:38px;line-height:1.02;max-width:12ch}
.hero p{color:var(--mute);margin-top:8px;max-width:38ch}
.search{margin:14px 16px 0}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font:inherit;font-weight:500}
.chip[aria-pressed=true]{background:var(--turf);color:#fff;border-color:var(--turf)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:4px 16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.ic{height:74px;border-radius:10px;background:linear-gradient(135deg,var(--willow),#f3e6c6);display:grid;place-items:center;font-size:38px}
.p h3{font-size:18px;line-height:1.1}
.p small{color:var(--mute)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:6px}
.price{font-weight:600}
.btn{border:0;background:var(--ball);color:#fff;font:inherit;font-weight:600;border-radius:10px;padding:8px 12px}
.btn.alt{background:var(--turf)}
.sec{display:none}.sec.on{display:block}
.svc{margin:0 16px 12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--turf);border-radius:14px;padding:14px}
.svc h3{font-size:21px}.svc p{color:var(--mute);margin:4px 0 10px}
.title{padding:18px 16px 6px;font-size:30px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:13px;padding:10px 0;position:relative}
nav button span{display:block;font-size:22px}
nav button[aria-current=true]{color:var(--turf);font-weight:600}
.badge{position:absolute;top:4px;left:56%;background:var(--ball);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.cartrow{display:flex;gap:10px;align-items:center;margin:0 16px 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.cartrow div:first-child{flex:1}
.q{display:flex;align-items:center;gap:8px}
.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px}
.form{margin:12px 16px;display:grid;gap:10px}
.total{display:flex;justify-content:space-between;margin:12px 16px;font-size:20px;font-weight:600}
.empty{margin:30px 16px;color:var(--mute);text-align:center}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
footer{padding:20px 16px;color:var(--mute);font-size:13px}
</style>

.ph{height:120px;margin:-12px -12px 4px;border-radius:14px 14px 0 0;overflow:hidden}

</style>

let cart={}, cat="All", term="";
try{cart=JSON.parse(localStorage.getItem("chcart2")||"{}")}catch(e){}
const $=id=>document.getElementById(id);
const inr=n=>"₹"+n.toLocaleString("en-IN");
const save=()=>{try{localStorage.setItem("chcart2",JSON.stringify(cart))}catch(e){}};
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1200)};
const key=i=>"p"+i;

function chips(){
  const cats=["All",...new Set(P.map(p=>p[1]))];
  $("chips").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
}
function grid(){
  const list=P.map((p,i)=>({p,i})).filter(({p})=>(cat==="All"||p[1]===cat)&&p[0].toLowerCase().includes(term));
  $("grid").innerHTML=list.length?list.map(({p,i})=>`<div class="p">${p[5]?`<div class="ph"><img class="${'kmn'.includes(p[5][0])?'fit':''}" loading="lazy" alt="${p[0]}" src="${IMG[p[5]]}"></div>`:`<div class="ic">${p[2]}</div>`}<h3>${p[0]}</h3><small>${p[4]}</small><div class="row"><span class="price">${inr(p[3])}</span><button class="btn" data-add="${i}">Add</button></div></div>`).join(""):`<p class="empty" style="grid-column:1/-1">No products match. Try a different word or category.</p>`;
}
function services(){
  $("svcs").innerHTML=S.map((s,i)=>`<div class="svc">${s[3]?`<img alt="${s[0]}" src="${IMG[s[3]]}">`:""}<h3>${s[0]}</h3><p>${s[2]}</p><div class="row">${s[1]?`<span class="price">${s[1]}</span>`:"<span></span>"}<button class="btn" data-book="${i}">${s[4]}</button></div></div>`).join("");
}
function insights(){
  $("arts").innerHTML=A.map((a,i)=>`<div class="svc"><img alt="${a[0]}" src="${IMG[a[2]]}"><h3>${a[0]}</h3><p>${a[1]}</p><p id="a${i}" hidden style="color:var(--ink)">${a[3]}</p><button class="btn alt" data-read="${i}">Read More →</button></div>`).join("");
}
function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function renderCart(){
  const ids=Object.keys(cart);
  $("badge").textContent=count();$("badge").hidden=!count();
  if(!ids.length){$("cartlist").innerHTML=`<p class="empty">Your cart is empty. Add products from the Shop tab.</p>`;$("checkout").innerHTML="";return}
  let total=0;
  $("cartlist").innerHTML=ids.map(k=>{const p=P[+k.slice(1)];total+=p[3]*cart[k];
    return `<div class="cartrow"><div><b>${p[0]}</b><br><small>${inr(p[3])}</small></div><div class="q"><button data-dec="${k}" aria-label="Remove one">−</button><b>${cart[k]}</b><button data-inc="${k}" aria-label="Add one">+</button></div></div>`}).join("");
  $("checkout").innerHTML=`<div class="total"><span>Total</span><span>${inr(total)}</span></div>
  <div class="form"><input id="nm" placeholder="Your name" autocomplete="name"><input id="ph" type="tel" placeholder="Phone number" autocomplete="tel"><textarea id="ad" rows="2" placeholder="Delivery address"></textarea><button class="btn" id="order" style="padding:14px">Order on WhatsApp</button></div>`;
}
function wa(msg){window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,"_blank")}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.c){cat=t.dataset.c;chips();grid()}
  else if(t.dataset.add){const k=key(t.dataset.add);cart[k]=(cart[k]||0)+1;save();renderCart();toast("Added to cart")}
  else if(t.dataset.inc){cart[t.dataset.inc]++;save();renderCart()}
  else if(t.dataset.dec){if(--cart[t.dataset.dec]<=0)delete cart[t.dataset.dec];save();renderCart()}
  else if(t.dataset.read!==undefined){const d=$("a"+t.dataset.read);d.hidden=!d.hidden;t.textContent=d.hidden?"Read More →":"Show less"}
  else if(t.dataset.book){const s=S[t.dataset.book];if(s[5].startsWith("shop")){cat=s[5].split(":")[1];chips();grid();go("shop")}else wa(`Hi CricketHub, I'd like to enquire about: ${s[0]} ${s[1]}`)}
  else if(t.dataset.go){go(t.dataset.go)}
  else if(t.id==="wa0"){wa("Hi CricketHub, I need help choosing cricket gear.")}
  else if(t.id==="order"){
    const n=$("nm").value.trim(),p=$("ph").value.trim(),a=$("ad").value.trim();
    if(!n||!p||!a){toast("Fill name, phone and address");return}
    let tot=0;const lines=Object.keys(cart).map(k=>{const x=P[+k.slice(1)];tot+=x[3]*cart[k];return `• ${x[0]} × ${cart[k]} = ${inr(x[3]*cart[k])}`});
    wa(`New CricketHub order\n${lines.join("\n")}\nTotal: ${inr(tot)}\nName: ${n}\nPhone: ${p}\nAddress: ${a}`);
  }
});
function go(id){
  document.querySelectorAll(".sec").forEach(s=>s.classList.toggle("on",s.id===id));
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id));
  scrollTo(0,0);
}
$("q").addEventListener("input",e=>{term=e.target.value.toLowerCase();grid()});
chips();grid();services();insights();renderCart();
</script>
</body>
</html>
